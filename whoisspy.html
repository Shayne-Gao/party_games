<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>谁是卧底 - 经典版</title>
    <style>
        :root { --primary: #3498db; --danger: #e74c3c; --blank: #9b59b6; --bg: #f5f6fa; --card-bg: #ffffff; --text: #2c3e50; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            margin: 0; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
            overflow-x: hidden; 
            /* 优化移动端点击高亮 */
            -webkit-tap-highlight-color: transparent;
        }

        .app-container { 
            width: 100%; 
            max-width: 480px; 
            padding: 20px; 
            box-sizing: border-box; 
            position: relative;
            z-index: 1; 
        }

        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 卡片样式 */
        .glass-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 20px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
            margin-bottom: 20px; 
            position: relative; /* 确保内容不被遮挡 */
            z-index: 2;
        }
        
        .section-title { font-weight: bold; font-size: 0.9rem; color: #7f8c8d; margin-bottom: 15px; display: block; }
        
        /* 计数器 */
        .config-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed #eee; }
        .config-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .stepper { display: flex; align-items: center; gap: 10px; }
        
        /* 按钮增强样式，确保可点击 */
        .step-btn { 
            width: 32px; height: 32px; border-radius: 10px; border: none; 
            background: #eee; color: var(--text); font-size: 18px; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; 
            touch-action: manipulation; /* 优化触摸响应 */
            z-index: 5;
        }
        .step-btn:active { background: #ddd; }
        
        .step-val { font-size: 1.1rem; font-weight: bold; width: 24px; text-align: center; }

        /* 角色标签 */
        .role-tag-bar { display: flex; gap: 10px; margin-top: 15px; background: #f1f2f6; padding: 10px; border-radius: 12px; justify-content: center; }
        .rtag { font-size: 0.85rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; }
        .rtag-civ { color: var(--primary); background: #e1f5fe; }
        .rtag-und { color: var(--danger); background: #fdecea; }
        .rtag-blk { color: var(--blank); background: #f3e5f5; }

        /* 翻牌区 */
        .card-container { width: 100%; height: 40vh; min-height: 280px; perspective: 1000px; margin: 20px 0; position: relative; z-index: 10; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            border-radius: 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            padding: 20px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        .card-front { background: linear-gradient(135deg, #3498db, #2980b9); color: white; }
        .card-back { background: white; border: 4px solid var(--primary); transform: rotateY(180deg); }

        /* 输入框与按钮 */
        .names-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .name-input { 
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; 
            box-sizing: border-box; font-size: 0.95rem; appearance: none;
        }
        
        .btn { 
            background: var(--text); color: white; border: none; padding: 16px; 
            border-radius: 15px; font-size: 1.1rem; font-weight: bold; width: 100%; 
            cursor: pointer; margin-top: 10px; transition: 0.2s; 
            touch-action: manipulation;
            position: relative; z-index: 5;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }

        .vote-item { 
            background: white; padding: 18px; border-radius: 15px; text-align: center; 
            font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.04); 
            transition: 0.2s; border: 2px solid transparent; cursor: pointer;
        }
        .vote-item.out { background: #dfe6e9; color: #b2bec3; text-decoration: line-through; pointer-events: none; }
        
        .status-header { background: var(--text); color: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="page-setup" class="page active">
        <h1 style="text-align: center; margin-bottom: 5px;">🕵️ 谁是卧底</h1>
        <p style="text-align: center; color: #95a5a6; font-size: 0.9rem; margin-bottom: 20px;">经典模式 · 词语对抗</p>
        
        <div class="glass-card">
            <span class="section-title">人数配置</span>
            
            <div class="config-row">
                <span>总人数</span>
                <div class="stepper">
                    <button class="step-btn" onclick="adjustTotal(-1)">-</button>
                    <span class="step-val" id="val-total">6</span>
                    <button class="step-btn" onclick="adjustTotal(1)">+</button>
                </div>
            </div>

            <div class="config-row">
                <span>卧底人数</span>
                <div class="stepper">
                    <button class="step-btn" onclick="adjustRole('undercover', -1)">-</button>
                    <span class="step-val" id="val-und">1</span>
                    <button class="step-btn" onclick="adjustRole('undercover', 1)">+</button>
                </div>
            </div>

            <div class="config-row">
                <span>白板人数</span>
                <div class="stepper">
                    <button class="step-btn" onclick="adjustRole('blank', -1)">-</button>
                    <span class="step-val" id="val-blk">0</span>
                    <button class="step-btn" onclick="adjustRole('blank', 1)">+</button>
                </div>
            </div>

            <div class="role-tag-bar">
                <span class="rtag rtag-civ">平民: <span id="disp-civ">5</span></span>
                <span class="rtag rtag-und">卧底: <span id="disp-und">1</span></span>
                <span class="rtag rtag-blk" id="tag-blk" style="display:none;">白板: <span id="disp-blk">0</span></span>
            </div>
            <p id="config-err" style="color: #e74c3c; font-size: 0.8rem; text-align: center; margin-top: 10px; display: none;">配置无效：平民人数不足</p>
        </div>

        <div class="glass-card">
            <span class="section-title">选择词库</span>
            <select id="topic-select" style="width:100%; padding:12px; border-radius:12px; border:1px solid #ddd; background:white; font-size:1rem;"></select>
        </div>

        <div class="glass-card">
            <span class="section-title">玩家昵称</span>
            <div class="names-grid" id="names-container"></div>
        </div>

        <button class="btn" onclick="startGame()">发牌</button>
    </div>

    <div id="page-deal" class="page">
        <h2 style="text-align:center;">身份查验</h2>
        <p id="turn-msg" style="text-align:center; color:#7f8c8d;"></p>
        
        <div class="card-container" onclick="handleCardTap()">
            <div class="card-inner" id="card-inner">
                <div class="card-front">
                    <div style="font-size: 3rem; margin-bottom: 10px;">🔍</div>
                    <div id="p-name-disp" style="font-size: 1.5rem; font-weight: bold;"></div>
                    <p id="front-sub">点击翻牌</p>
                </div>
                <div class="card-back">
                    <div id="word-disp" style="font-size: 2.2rem; font-weight: bold; margin: 20px 0; word-break: break-all;"></div>
                    <div style="font-size: 0.9rem; color: #95a5a6; margin-top: 20px;">请记住词语，不要暴露</div>
                    <p style="font-size: 0.8rem; color: var(--primary); margin-top: 30px;">(再次点击隐藏并传递)</p>
                </div>
            </div>
        </div>
    </div>

    <div id="page-game" class="page">
        <h2 style="text-align:center;">投票处决</h2>
        
        <div class="status-header" onclick="toggleStatus()">
            <span id="st-text">📊 存活统计 (点击查看)</span>
            <span>👁️</span>
        </div>
        <div id="st-detail" style="display:none; background:white; padding:15px; border-radius:12px; margin-bottom:20px; text-align:center; color:#2c3e50; font-weight:bold; box-shadow: 0 4px 10px rgba(0,0,0,0.05);"></div>

        <div class="names-grid" id="vote-grid"></div>
        
        <button class="btn" style="background:#95a5a6; margin-top:20px;" onclick="softReset()">再来一局</button>
    </div>
</div>

<script src="./shared_word_bank.js"></script>
<script>
// --- 核心逻辑 ---

const state = {
    total: 6,
    und: 1,
    blk: 0,
    players: [],
    currentIdx: 0,
    flipped: false,
    stVisible: false
};

const sharedWordBank = window.PARTY_GAME_SHARED_WORD_BANK || {};

// 1. 初始化 (改为页面加载完成后执行，防止找不到元素)
window.onload = function() {
    try {
        init();
    } catch(e) {
        alert("初始化失败，请刷新页面: " + e.message);
    }
};

function init() {
    const sel = document.getElementById('topic-select');
    if(!sel) return; // 容错
    for (let k in sharedWordBank) {
        let opt = document.createElement('option');
        opt.value = k;
        opt.innerText = k;
        sel.appendChild(opt);
    }
    renderUI();
}

// 2. 配置逻辑
function adjustTotal(d) {
    let n = state.total + d;
    if (n < 3 || n > 20) return;
    state.total = n;
    validateRoles();
    renderUI();
}

function adjustRole(type, d) {
    if (type === 'undercover') {
        let n = state.und + d;
        if (n < 1) return;
        state.und = n;
    } else if (type === 'blank') {
        let n = state.blk + d;
        if (n < 0) return;
        state.blk = n;
    }
    validateRoles();
    renderUI();
}

function validateRoles() {
    let civ = state.total - state.und - state.blk;
    while (civ < 1 && state.total > 0) {
        if (state.blk > 0) state.blk--;
        else if (state.und > 1) state.und--; 
        else break; 
        civ = state.total - state.und - state.blk;
    }
}

function renderUI() {
    document.getElementById('val-total').innerText = state.total;
    document.getElementById('val-und').innerText = state.und;
    document.getElementById('val-blk').innerText = state.blk;
    
    let civ = state.total - state.und - state.blk;
    document.getElementById('disp-civ').innerText = civ;
    document.getElementById('disp-und').innerText = state.und;
    document.getElementById('disp-blk').innerText = state.blk;
    
    document.getElementById('tag-blk').style.display = state.blk > 0 ? 'inline-block' : 'none';

    // 昵称输入框 - 优化：只增减，不全量重绘，保持输入焦点
    const grid = document.getElementById('names-container');
    const existingInputs = grid.children;
    
    // 如果现有输入框少于总人数，补齐
    if (existingInputs.length < state.total) {
        for (let i = existingInputs.length; i < state.total; i++) {
            let inp = document.createElement('input');
            inp.className = 'name-input';
            inp.value = (i + 1) + "号";
            inp.id = 'name-' + i;
            grid.appendChild(inp);
        }
    } 
    // 如果现有输入框多于总人数，移除多余的
    else if (existingInputs.length > state.total) {
        while (existingInputs.length > state.total) {
            grid.removeChild(grid.lastChild);
        }
    }
    
    const isValid = civ >= 1;
    document.getElementById('config-err').style.display = isValid ? 'none' : 'block';
}

// 3. 游戏开始
function startGame() {
    let civ = state.total - state.und - state.blk;
    if (civ < 1) { alert("平民人数不足！"); return; }

    const topic = document.getElementById('topic-select').value;
    const entries = sharedWordBank[topic];
    if (!entries || entries.length === 0) { alert("词库加载失败"); return; }
    const pair = entries[Math.floor(Math.random() * entries.length)];
    const wordCiv = pair.left;
    const wordUnd = pair.right;

    let roles = [];
    for(let i=0; i<civ; i++) roles.push({ type: 'civ', word: wordCiv });
    for(let i=0; i<state.und; i++) roles.push({ type: 'und', word: wordUnd });
    for(let i=0; i<state.blk; i++) roles.push({ type: 'blk', word: '???' });

    // 费雪耶茨洗牌
    for (let i = roles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [roles[i], roles[j]] = [roles[j], roles[i]];
    }

    state.players = roles.map((r, i) => ({
        name: document.getElementById('name-'+i).value,
        type: r.type,
        word: r.word,
        out: false,
        idx: i
    }));

    state.currentIdx = 0;
    state.flipped = false;
    showPage('deal');
    renderCard();
}

// 4. 发牌逻辑
function renderCard() {
    const p = state.players[state.currentIdx];
    const card = document.getElementById('card-inner');
    card.classList.remove('flipped');
    
    document.getElementById('p-name-disp').innerText = p.name;
    document.getElementById('front-sub').innerText = "点击翻牌";
    document.getElementById('turn-msg').innerText = `请 ${p.name} 接过手机查看词语`;
}

function handleCardTap() {
    const card = document.getElementById('card-inner');
    const p = state.players[state.currentIdx];
    
    if (!state.flipped) {
        document.getElementById('word-disp').innerText = p.word;
        card.classList.add('flipped');
        state.flipped = true;
    } else {
        card.classList.remove('flipped');
        state.flipped = false;
        document.getElementById('front-sub').innerText = "已隐藏，传给下一位";
        
        setTimeout(() => {
            state.currentIdx++;
            if (state.currentIdx < state.total) {
                renderCard();
            } else {
                showPage('game');
                renderVote();
            }
        }, 600);
    }
}

// 5. 投票逻辑
function renderVote() {
    const grid = document.getElementById('vote-grid');
    grid.innerHTML = '';
    state.players.forEach(p => {
        let div = document.createElement('div');
        div.className = `vote-item ${p.out ? 'out' : ''}`;
        div.innerText = p.name;
        // 使用 ontouchstart 兼容部分移动端
        div.onclick = () => { if(!p.out) handleOut(p); };
        grid.appendChild(div);
    });
    updateStatusText();
}

function handleOut(p) {
    if (confirm(`确定投出 [${p.name}] 吗？`)) {
        p.out = true;
        renderVote();
        checkWin();
    }
}

function checkWin() {
    const alive = state.players.filter(p => !p.out);
    const civCount = alive.filter(p => p.type === 'civ').length;
    const badCount = alive.filter(p => p.type !== 'civ').length; 

    if (badCount >= civCount) {
        setTimeout(() => alert("😈 卧底胜利！\n(坏人人数已超过或等于平民)"), 300);
    }
    else if (badCount === 0) {
        setTimeout(() => alert("🎉 平民胜利！\n(所有卧底和白板已出局)"), 300);
    }
    updateStatusText(); // 确保状态栏更新
}

function toggleStatus() {
    state.stVisible = !state.stVisible;
    updateStatusText();
}

function updateStatusText() {
    const box = document.getElementById('st-detail');
    if (state.stVisible) {
        const alive = state.players.filter(p => !p.out);
        const civ = alive.filter(p => p.type === 'civ').length;
        const und = alive.filter(p => p.type === 'und').length;
        const blk = alive.filter(p => p.type === 'blk').length;
        
        box.style.display = 'block';
        box.innerHTML = `
            <span style="color:var(--primary)">平民: ${civ}</span> &nbsp;|&nbsp; 
            <span style="color:var(--danger)">卧底: ${und}</span> &nbsp;|&nbsp; 
            <span style="color:var(--blank)">白板: ${blk}</span>
        `;
        document.getElementById('st-text').innerText = "📊 存活统计 (点击隐藏)";
    } else {
        box.style.display = 'none';
        document.getElementById('st-text').innerText = "📊 存活统计 (点击查看)";
    }
}

// 6. 软重置
function softReset() {
    state.currentIdx = 0;
    state.flipped = false;
    state.players = [];
    state.stVisible = false;
    document.getElementById('st-detail').style.display = 'none';
    showPage('setup');
}

function showPage(id) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.getElementById('page-'+id).classList.add('active');
}

</script>
</body>
</html>
