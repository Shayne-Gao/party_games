<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>瞎话王</title>
    <script src="./liar_king_word_bank.js"></script>
    <style>
        :root {
            --primary: #8e44ad;
            --danger: #e67e22;
            --bg: #f6f1fb;
            --card-bg: #ffffff;
            --text: #262033;
            --muted: #857993;
            --line: #e7dff0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background:
                radial-gradient(circle at top left, rgba(142, 68, 173, 0.18), transparent 34%),
                linear-gradient(180deg, #fbf8ff 0%, var(--bg) 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .page { display: none; animation: fadeIn 0.25s ease; }
        .page.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-link {
            display: inline-block;
            margin-bottom: 12px;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
        }

        h1, h2 { text-align: center; margin: 8px 0; }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.5;
            margin: 0 0 20px;
        }

        .glass-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid rgba(142, 68, 173, 0.08);
            box-shadow: 0 10px 28px rgba(74, 46, 96, 0.08);
        }

        .section-title {
            display: block;
            margin-bottom: 14px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .config-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed var(--line);
        }

        .config-row:last-child { border-bottom: none; }

        .stepper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .step-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 11px;
            background: #efe5f7;
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
        }

        .step-val {
            min-width: 24px;
            text-align: center;
            font-weight: 900;
        }

        select, input {
            width: 100%;
            padding: 13px 12px;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: #fff;
            color: var(--text);
            font: inherit;
            outline: none;
        }

        select:focus, input:focus {
            border-color: rgba(142, 68, 173, 0.45);
            box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.1);
        }

        .names-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            margin-top: 10px;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: var(--text);
            color: white;
            font: inherit;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
        }

        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #8c8199; }

        .role-bar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding: 10px;
            border-radius: 13px;
            background: #f4ecfa;
            justify-content: center;
        }

        .role-tag {
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 900;
        }

        .role-interrogator { color: #2c3e50; background: #e8eaf6; }
        .role-knower { color: var(--primary); background: #eadcf5; }
        .role-liar { color: var(--danger); background: #fff0df; }

        .card-container {
            width: 100%;
            height: 46vh;
            min-height: 330px;
            perspective: 1000px;
            margin: 20px 0;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-inner.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 26px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 16px 36px rgba(74, 46, 96, 0.14);
        }

        .card-front {
            background: linear-gradient(135deg, #8e44ad, #5e3370);
            color: white;
        }

        .card-back {
            background: white;
            border: 4px solid var(--primary);
            transform: rotateY(180deg);
        }

        .word {
            font-size: 2.4rem;
            font-weight: 900;
            margin: 8px 0 4px;
            word-break: break-all;
        }

        .pinyin {
            margin-bottom: 14px;
            color: var(--muted);
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .explanation {
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            background: #f7f0fb;
            color: var(--text);
            font-size: 1rem;
            line-height: 1.65;
            font-weight: 700;
        }

        .liar-note {
            color: var(--danger);
            background: #fff4e6;
        }

        .interrogator-note {
            color: #2c3e50;
            background: #eef1ff;
        }

        .hint {
            color: var(--muted);
            font-size: 0.86rem;
            line-height: 1.6;
        }

        .player-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .player-chip {
            padding: 12px;
            border-radius: 13px;
            background: #f6f0fb;
            text-align: center;
            font-weight: 800;
        }

        @media (max-width: 420px) {
            .app-container { padding: 16px 12px; }
            .names-grid, .player-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="page-setup" class="page active">
            <a class="top-link" href="./index.html">← 返回游戏目录</a>
            <h1>瞎话王</h1>
            <p class="subtitle">每局 1 个想想负责质问和指认，1 个老实人知道解释，其余人都是瞎话王。</p>

            <div class="glass-card">
                <span class="section-title">人数配置</span>
                <div class="config-row">
                    <span>总人数</span>
                    <div class="stepper">
                        <button class="step-btn" onclick="adjustTotal(-1)">-</button>
                        <span class="step-val" id="val-total">6</span>
                        <button class="step-btn" onclick="adjustTotal(1)">+</button>
                    </div>
                </div>
                <div class="role-bar">
                    <span class="role-tag role-interrogator">想想: 1</span>
                    <span class="role-tag role-knower">老实人: 1</span>
                    <span class="role-tag role-liar">瞎话王: <span id="disp-liars">1</span></span>
                </div>
            </div>

            <div class="glass-card">
                <span class="section-title">玩家昵称</span>
                <div class="names-grid" id="names-container"></div>
            </div>

            <button class="btn" onclick="startGame()">发牌</button>
        </div>

        <div id="page-deal" class="page">
            <h2>身份查验</h2>
            <p id="turn-msg" class="subtitle"></p>

            <div class="card-container" onclick="handleCardTap()">
                <div class="card-inner" id="card-inner">
                    <div class="card-front">
                        <div style="font-size:3rem;margin-bottom:10px;">🤥</div>
                        <div id="player-name-display" style="font-size:1.55rem;font-weight:900;"></div>
                        <p id="front-sub">点击翻牌</p>
                    </div>
                    <div class="card-back">
                        <div id="role-display" class="hint"></div>
                        <div id="word-display" class="word"></div>
                        <div id="pinyin-display" class="pinyin"></div>
                        <div id="explanation-display" class="explanation"></div>
                        <p class="hint" style="margin-top:22px;">再次点击隐藏并传给下一位</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="page-game" class="page">
            <h2>开始发言</h2>
            <div class="glass-card">
                <span class="section-title">玩法提示</span>
                <p class="hint">
                    想想负责提问、吐槽和控场，但不看解释。所有非想想玩家都要解释这个词；老实人按真解释说，瞎话王根据词语和别人发言临场编。最后想想指认谁是老实人。
                </p>
            </div>
            <div class="glass-card">
                <span class="section-title">玩家列表</span>
                <div class="player-list" id="player-list"></div>
            </div>
            <button class="btn btn-secondary" onclick="softReset()">再来一局</button>
        </div>
    </div>

    <script>
        const wordBank = window.LIAR_KING_WORD_BANK || {};

        const state = {
            total: 6,
            players: [],
            currentIdx: 0,
            flipped: false,
            currentEntry: null
        };

        window.onload = init;

        function init() {
            renderSetup();
        }

        function adjustTotal(delta) {
            const next = state.total + delta;
            if (next < 3 || next > 20) return;
            state.total = next;
            renderSetup();
        }

        function renderSetup() {
            document.getElementById("val-total").textContent = state.total;
            document.getElementById("disp-liars").textContent = state.total - 2;

            const container = document.getElementById("names-container");
            while (container.children.length < state.total) {
                const index = container.children.length;
                const input = document.createElement("input");
                input.id = `name-${index}`;
                input.value = `${index + 1}号`;
                input.maxLength = 16;
                container.appendChild(input);
            }
            while (container.children.length > state.total) {
                container.removeChild(container.lastChild);
            }
        }

        function startGame() {
            const entries = getAllEntries();
            if (!entries.length) {
                alert("词库为空，请先补充词库");
                return;
            }

            state.currentEntry = entries[Math.floor(Math.random() * entries.length)];
            const roles = [];
            roles.push({ type: "interrogator" });
            roles.push({ type: "knower" });
            for (let i = 0; i < state.total - 2; i += 1) {
                roles.push({ type: "liar" });
            }
            shuffleInPlace(roles);

            state.players = roles.map((role, index) => ({
                name: document.getElementById(`name-${index}`).value.trim() || `${index + 1}号`,
                type: role.type
            }));
            state.currentIdx = 0;
            state.flipped = false;
            showPage("deal");
            renderCard();
        }

        function getAllEntries() {
            return Object.values(wordBank).reduce((all, entries) => {
                if (Array.isArray(entries)) all.push(...entries);
                return all;
            }, []);
        }

        function renderCard() {
            const player = state.players[state.currentIdx];
            const card = document.getElementById("card-inner");
            card.classList.remove("flipped");
            document.getElementById("player-name-display").textContent = player.name;
            document.getElementById("front-sub").textContent = "点击翻牌";
            document.getElementById("turn-msg").textContent = `请 ${player.name} 接过手机查看自己的牌`;
        }

        function handleCardTap() {
            const card = document.getElementById("card-inner");
            const player = state.players[state.currentIdx];
            if (!state.flipped) {
                revealCard(player);
                card.classList.add("flipped");
                state.flipped = true;
                return;
            }

            card.classList.remove("flipped");
            state.flipped = false;
            document.getElementById("front-sub").textContent = "已隐藏，传给下一位";
            setTimeout(() => {
                state.currentIdx += 1;
                if (state.currentIdx < state.players.length) {
                    renderCard();
                } else {
                    showPage("game");
                    renderPlayerList();
                }
            }, 560);
        }

        function revealCard(player) {
            const entry = state.currentEntry;
            const isLiar = player.type === "liar";
            const isInterrogator = player.type === "interrogator";
            document.getElementById("role-display").textContent = getRoleText(player.type);
            document.getElementById("word-display").textContent = entry.word;
            document.getElementById("pinyin-display").textContent = entry.pinyin || "";
            const explanation = document.getElementById("explanation-display");
            if (isInterrogator) {
                explanation.textContent = "你不看解释。你负责质问所有人，最后指认谁是老实人。";
                explanation.className = "explanation interrogator-note";
            } else if (isLiar) {
                explanation.textContent = "你只能看到这个词，没有解释。请根据字面意思和别人发言临场编。";
                explanation.className = "explanation liar-note";
            } else {
                explanation.textContent = entry.explanation;
                explanation.className = "explanation";
            }
        }

        function getRoleText(type) {
            if (type === "interrogator") return "你是想想 / 审讯者";
            if (type === "knower") return "你是老实人，你拿到完整解释";
            return "你是瞎话王，你的信息不完整";
        }

        function renderPlayerList() {
            const list = document.getElementById("player-list");
            list.innerHTML = state.players.map((player) => `<div class="player-chip">${escapeHtml(player.name)}</div>`).join("");
        }

        function softReset() {
            state.players = [];
            state.currentEntry = null;
            state.currentIdx = 0;
            state.flipped = false;
            showPage("setup");
        }

        function showPage(id) {
            document.querySelectorAll(".page").forEach((page) => page.classList.remove("active"));
            document.getElementById(`page-${id}`).classList.add("active");
        }

        function shuffleInPlace(array) {
            for (let i = array.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }
    </script>
</body>
</html>
