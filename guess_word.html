<!DOCTYPE html>

    <style>
        :root { --primary: #6366f1; --success: #22c55e; --danger: #ef4444; --warning: #f59e0b; --bg: #0f172a; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: white; overflow: hidden; touch-action: manipulation; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }
        .config-card { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 24px; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { font-size: 2rem; margin: 0 0 10px 0; text-align: center; }
        .hint-text { font-size: 0.85rem; color: #94a3b8; text-align: center; margin-bottom: 20px; line-height: 1.6; }
        select { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 12px; border: 2px solid #334155; background: #1e293b; color: white; font-size: 1.1rem; outline: none; }
        .btn { width: 100%; padding: 18px; border-radius: 15px; border: none; background: var(--primary); color: white; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        #game-screen { background: #000; }
        #word-display { font-size: 18vw; font-weight: 900; text-align: center; z-index: 10; pointer-events: none; }
        #timer-bar { position: absolute; top: 0; left: 0; height: 10px; background: var(--primary); width: 100%; transition: width 0.3s; }
        .tap-zone { position: absolute; top: 0; height: 100%; width: 50%; display: flex; align-items: center; justify-content: center; z-index: 5; opacity: 0.1; }
        #left-zone { left: 0; background: var(--success); }
        #right-zone { right: 0; background: var(--danger); }
        #result-screen { justify-content: flex-start; overflow-y: auto; padding-top: 40px; }
        .score-num { font-size: 6rem; font-weight: 800; color: var(--primary); margin: 0; line-height: 1.2; }
        .history-container { width: 100%; max-width: 400px; margin-top: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; padding: 10px; max-height: 45vh; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .status-ok { color: var(--success); }
        .status-skip { color: var(--danger); }
        .status-none { color: var(--warning); font-style: italic; font-size: 0.9rem; }
        .flash-success { animation: flashG 0.4s; }
        .flash-danger { animation: flashR 0.4s; }
        @keyframes flashG { from { background: var(--success); } to { background: #000; } }
        @keyframes flashR { from { background: var(--danger); } to { background: #000; } }

    <script>
        let gameData = {}; let currentPool = []; let gameHistory = [];
        let score = 0, skip = 0, timeLeft = 0, totalTime = 0, timer = null;
        let currentWord = ""; let isProcessingAction = false; let audioCtx = null;

        function playBeep(freq, duration) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.value = freq; gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function requestPermissionAndStart() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(() => startGame()).catch(() => startGame());
            } else startGame();
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function parseVocabulary() {
            const raw = document.getElementById('vocabulary-data').innerText;
            raw.split('\n').forEach(line => {
                if (line.includes(':')) {
                    const parts = line.split(':');
                    const category = parts[0].trim();
                    const words = parts[1].trim().split(/\s+/);
                    if (category && words.length > 0) gameData[category] = words;
                }
            });
            const select = document.getElementById('category-select');
            for (let cat in gameData) {
                let opt = document.createElement('option'); opt.value = cat; opt.innerText = cat; select.appendChild(opt);
            }
        }

        function startGame() {
            const cat = document.getElementById('category-select').value;
            totalTime = parseInt(document.getElementById('time-select').value);
            timeLeft = totalTime;
            currentPool = [...gameData[cat]].sort(() => Math.random() - 0.5);
            score = 0; skip = 0; gameHistory = [];
            switchScreen('game-screen');
            let count = 3; document.getElementById('word-display').innerText = count;
            let cd = setInterval(() => {
                count--;
                if(count > 0) { playBeep(800, 0.1); document.getElementById('word-display').innerText = count; }
                else { clearInterval(cd); playBeep(1200, 0.3); nextWord(); startTimer(); window.addEventListener('deviceorientation', handleMotion); }
            }, 800);
            try { document.documentElement.requestFullscreen(); } catch(e){}
        }

        function handleMotion(event) {
            if (isProcessingAction || timeLeft <= 0) return;
            const g = event.gamma; 
            if (g < -65) handleResult(true);
            else if (g > 65) handleResult(false);
        }

        function nextWord() {
            if (currentPool.length === 0) return endGame();
            currentWord = currentPool.pop();
            document.getElementById('word-display').innerText = currentWord;
        }

        function handleResult(isOk) {
            if (isProcessingAction || timeLeft <= 0) return;
            isProcessingAction = true;
            gameHistory.push({ word: currentWord, status: isOk ? 'ok' : 'skip' });
            isOk ? score++ : skip++;
            triggerFlash(isOk ? 'flash-success' : 'flash-danger');
            playBeep(isOk ? 1000 : 400, 0.2);
            if (navigator.vibrate) navigator.vibrate(80);
            nextWord();
            setTimeout(() => isProcessingAction = false, 1200);
        }

        function triggerFlash(cls) {
            const s = document.getElementById('game-screen');
            s.classList.remove('flash-success', 'flash-danger');
            void s.offsetWidth; s.classList.add(cls);
        }

        function startTimer() {
            const bar = document.getElementById('timer-bar');
            timer = setInterval(() => {
                timeLeft--;
                bar.style.width = (timeLeft / totalTime * 100) + "%";
                if (timeLeft <= 10 && timeLeft > 0) { bar.style.background = "var(--danger)"; playBeep(600, 0.05); }
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            clearInterval(timer);
            window.removeEventListener('deviceorientation', handleMotion);
            
            // 修正后的逻辑：只记录“时间到”时显示在屏幕上的那个词
            if (currentWord && !gameHistory.some(h => h.word === currentWord)) {
                gameHistory.push({ word: currentWord, status: 'none' });
            }

            document.getElementById('final-score').innerText = score;
            document.getElementById('stats-detail').innerText = `正确: ${score} | 跳过: ${skip}`;
            const listEl = document.getElementById('history-list'); listEl.innerHTML = "";
            gameHistory.forEach(item => {
                const div = document.createElement('div'); div.className = "history-item";
                let s = item.status === 'ok' ? '<span class="status-ok">✔</span>' : (item.status === 'skip' ? '<span class="status-skip">✘</span>' : '<span class="status-none">- 未猜出</span>');
                div.innerHTML = `<span class="item-word">${item.word}</span>${s}`;
                listEl.appendChild(div);
            });
            switchScreen('result-screen');
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        window.onload = parseVocabulary;
    </script>
